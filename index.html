<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>כלי הערכה פדגוגית — אב טיפוס</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600;700&family=Heebo:wght@300;400;500;600;700&family=Assistant:wght@300;400;500;600;700&family=Noto+Serif+Hebrew:wght@400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --surface-2: #f5f3ee; --surface-3: #ebe8e0;
  --border: #d8d1c5; --border-strong: #c4baa8;
  --ink-1: #1a1f2c; --ink-2: #4a5468; --ink-3: #5d6779; --ink-4: #646878;
  --brand: #1e3a5f; --brand-2: #2c5282; --brand-3: #3b6fa5;
  --brand-soft: #e8eef5; --brand-softer: #f3f6fa;
  --accent: #b08552; --accent-soft: #f4ecdf;
  --ok: #1e6035; --ok-soft: #e3f0e8;
  --warn: #8a4a14; --warn-soft: #fbeede;
  --info: #2c5282; --info-soft: #e8eef5;
  --highlight: #fff066;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --gap-1: 6px; --gap-2: 10px; --gap-3: 14px; --gap-4: 20px; --gap-5: 28px;
  --pad-card: 20px; --row-h: 44px;
  --font-serif: 'Frank Ruhl Libre','Noto Serif Hebrew',Georgia,serif;
  --font-sans: 'Rubik','Heebo','Assistant',system-ui,-apple-system,sans-serif;
  --font-mono: 'JetBrains Mono',ui-monospace,monospace;
  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px; --fs-16: 16px;
  --fs-18: 18px; --fs-22: 22px; --fs-28: 28px; --fs-36: 36px;
  --shadow-1: 0 1px 0 rgba(26,31,44,.05),0 1px 3px rgba(26,31,44,.06);
  --shadow-2: 0 1px 0 rgba(26,31,44,.05),0 4px 14px rgba(26,31,44,.08);
  --shadow-3: 0 8px 32px rgba(26,31,44,.12),0 2px 8px rgba(26,31,44,.07);
  --shadow-modal: 0 24px 80px rgba(26,31,44,.24),0 8px 24px rgba(26,31,44,.12);
}
[data-density="compact"] {
  --gap-1:4px;--gap-2:7px;--gap-3:10px;--gap-4:14px;--gap-5:20px;
  --pad-card:14px;--row-h:36px;--fs-14:13px;--fs-15:13.5px;--fs-16:14px;
}
[data-dark="true"] {
  --bg:#14171f;--surface:#1c2030;--surface-2:#232838;--surface-3:#2c3245;
  --border:#2e3548;--border-strong:#3b435a;
  --ink-1:#f1f3f8;--ink-2:#c9cfdd;--ink-3:#8a93a6;--ink-4:#7c8398;
  --brand:#6ea3d8;--brand-2:#5b8fc4;--brand-3:#4878ad;
  --brand-soft:#1f2a3d;--brand-softer:#1a2230;
  --accent:#d9aa6e;--accent-soft:#2b2419;
  --ok-soft:#1b2e22;--warn-soft:#2e2418;--info-soft:#1f2a3d;
  --highlight:#b9a232;
  --shadow-1:0 1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 1px 0 rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.35);
  --shadow-3:0 8px 32px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.30);
  --shadow-modal:0 24px 80px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body,#app{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink-1);font-family:var(--font-sans);font-size:var(--fs-15);line-height:1.65;direction:rtl;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--brand-2);text-decoration:none;}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden;}
[data-density="compact"] .app{grid-template-columns:220px 1fr;}
.sidebar{background:var(--surface);border-inline-start:1px solid var(--border);padding:var(--gap-4) var(--gap-3);display:flex;flex-direction:column;gap:var(--gap-4);overflow-y:auto;}
.brand-mark{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;border-bottom:1px solid var(--border);}
.brand-glyph{width:34px;height:34px;background:var(--brand);color:#fff;display:grid;place-items:center;border-radius:8px;font-family:var(--font-serif);font-weight:700;font-size:18px;letter-spacing:-0.02em;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--ink-1);}
.brand-text span{font-size:11px;color:var(--ink-3);letter-spacing:0.02em;}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 6px;font-size:var(--fs-13);color:var(--ink-2);}
.user-chip .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-size:var(--fs-14);text-align:start;width:100%;transition:background .15s;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600;}
.nav-item .icon{width:16px;height:16px;flex-shrink:0;}
.nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.10em;color:var(--ink-3);padding:8px 10px 4px;font-weight:600;}
.main{overflow-y:auto;overflow-x:hidden;background:var(--bg);}
.main-inner{max-width:1200px;margin:0 auto;padding:var(--gap-5) var(--gap-5);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px var(--gap-5);border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;}
.topbar h1{font-family:var(--font-serif);font-size:var(--fs-22);font-weight:600;margin:0;color:var(--ink-1);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;height:38px;border-radius:var(--r-sm);font-size:var(--fs-14);font-weight:500;border:1px solid transparent;transition:all .15s;white-space:nowrap;}
.btn:hover{transform:translateY(-0.5px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-2);}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--ink-1);}
.btn-secondary:hover{background:var(--surface-2);}
.btn-ghost{color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-magic{background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#fff;position:relative;overflow:hidden;}
.btn-magic::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(100%);transition:transform .8s;}
.btn-magic:hover::before{transform:translateX(-100%);}
.btn-lg{height:46px;padding:0 22px;font-size:var(--fs-15);}
.btn-sm{height:30px;padding:0 10px;font-size:var(--fs-13);}
.btn-icon{width:32px;padding:0;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--pad-card);box-shadow:var(--shadow-1);}
.card-hover{cursor:pointer;transition:all .18s;}
.card-hover:hover{border-color:var(--border-strong);box-shadow:var(--shadow-2);transform:translateY(-1px);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;letter-spacing:0.01em;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-ok{background:var(--ok-soft);color:var(--ok);}
.badge-info{background:var(--info-soft);color:var(--info);}
.badge-neutral{background:var(--surface-2);color:var(--ink-3);}
.badge-accent{background:var(--accent-soft);color:var(--accent);}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 var(--gap-3);}
.section-title h2{font-family:var(--font-serif);font-size:var(--fs-22);font-weight:600;margin:0;color:var(--ink-1);letter-spacing:-0.02em;line-height:1.25;}
.section-title .hint{font-size:var(--fs-13);color:var(--ink-3);}
.input,.textarea,.select{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-14);color:var(--ink-1);width:100%;transition:border-color .15s,box-shadow .15s;}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-softer);}
.textarea{resize:vertical;min-height:100px;line-height:1.75;}
.label{display:block;font-size:var(--fs-13);font-weight:600;color:var(--ink-1);margin-bottom:6px;letter-spacing:0.01em;}
.tag{display:inline-block;padding:1px 8px;font-size:11.5px;border-radius:4px;background:var(--brand-soft);color:var(--brand);font-weight:500;font-family:var(--font-sans);border:1px solid transparent;cursor:pointer;transition:all .12s;vertical-align:baseline;white-space:nowrap;line-height:1.5;}
.tag:hover{background:var(--brand);color:#fff;}
.tag.active{background:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--brand-soft);}
.main::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:10px;height:10px;}
.main::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid var(--bg);}
.main::-webkit-scrollbar-track{background:transparent;}
.divider{height:1px;background:var(--border);margin:var(--gap-3) 0;}
@keyframes fadeIn{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes fadeInScale{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
@keyframes screenEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}
@keyframes ripple{0%{transform:scale(0.8);opacity:0.8}100%{transform:scale(2.4);opacity:0}}
.fade-in{animation:fadeIn .35s ease both;}
.screen-enter{animation:screenEnter .3s cubic-bezier(.2,.8,.3,1) both;}
.nav-item:focus-visible{outline:2px solid var(--brand);outline-offset:-1px;background:var(--brand-soft);}
.btn:focus-visible,.tag:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
.mob-menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-sm);color:var(--ink-2);cursor:pointer;transition:background .15s;}
.mob-menu-btn:hover{background:var(--surface-2);}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;animation:overlayIn .2s ease both;}
@media(max-width:768px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;top:0;bottom:0;right:0;width:270px;z-index:50;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-modal);}
  .sidebar.mob-open{transform:translateX(0);}
  .mob-overlay.mob-open{display:block;}
  .mob-menu-btn{display:flex;}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
@media print{.sidebar,.topbar,.twk-panel{display:none!important;}.main{overflow:visible!important;}}
  </style>
</head>
<body>
  <div id="app"></div>

<script type="text/babel">
// ── tweaks-panel.jsx ─────────────────────────────────────────────────────────
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current; if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, window.innerWidth - w - PAD), Math.max(PAD, offsetRef.current.x)),
      y: Math.min(Math.max(PAD, window.innerHeight - h - PAD), Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = (e) => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const move = (ev) => { offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) }; clampToViewport(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}
function TweakSection({ label }) { return <div className="twk-sect">{label}</div>; }
function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl"><span>{label}</span>{value != null && <span className="twk-val">{value}</span>}</div>
      {children}
    </div>
  );
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}
      </select>
    </TweakRow>
  );
}

function DonutChart({ segments, total, size=100 }) {
  const r = size * 0.36, C = 2 * Math.PI * r, cx = size/2, cy = size/2, sw = size * 0.15;
  let cum = 0;
  return (
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--surface-2)" strokeWidth={sw}/>
        {segments.filter(s=>s.value>0).map((seg,i)=>{
          const len=(seg.value/total)*C, off=C-cum; cum+=len;
          return <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={seg.color} strokeWidth={sw}
            strokeDasharray={`${len} ${C}`} strokeDashoffset={off}
            style={{transition:'stroke-dasharray .6s ease .1s'}}/>;
        })}
      </svg>
      <div style={{position:'absolute',inset:0,display:'grid',placeItems:'center',pointerEvents:'none'}}>
        <div style={{textAlign:'center',lineHeight:1}}>
          <div style={{fontFamily:'var(--font-serif)',fontSize:size*.24,fontWeight:700,color:'var(--ink-1)'}}>{total}</div>
          <div style={{fontSize:size*.11,color:'var(--ink-3)',marginTop:3}}>סטודנטים</div>
        </div>
      </div>
    </div>
  );
}

function resolveCategoryInputs(cat, answers) {
  answers = answers||{};
  let instructorText = '';
  if(cat.usesInstructorInput){const a=answers[cat.usesInstructorInput];instructorText=typeof a==='string'?a:(a&&a.note)||'';}
  let decisionText = '';
  if(cat.gap&&cat.gap.decisionKey){const a=answers[cat.gap.decisionKey];if(a&&a.label){decisionText=`לאחר התייעצות החלטת ${a.label}${a.note?` — ${a.note}`:''}. `;}else{decisionText=cat.gap.resolution||'';}}
  else if(cat.gap&&cat.gap.resolution){decisionText=cat.gap.resolution;}
  return {instructorText,decisionText};
}

function renderEvidenceTokens(text, activeEid, onClick, inputs) {
  const {instructorText,decisionText} = inputs||{};
  const parts = text.split(/(\{\{e\d+\}\}|\{\{instructor_input\}\}|\{\{decision\}\})/g);
  return parts.map((part,i)=>{
    const eMatch = part.match(/\{\{(e\d+)\}\}/);
    if(eMatch){
      const eid=eMatch[1]; const ev=EVIDENCES[eid]; const isActive=activeEid===eid;
      const trackColors = ev?.track==='lesson_plan'?TRACK_TONE.lesson_plan:ev?.track==='observation'?TRACK_TONE.observation:{bg:'var(--brand-soft)',fg:'var(--brand)',activeBg:'var(--brand)',Icon:null};
      return <span key={i} onClick={(e)=>{e.stopPropagation();onClick(eid);}} className="tag" style={{margin:'0 2px',cursor:'pointer',background:isActive?trackColors.activeBg:trackColors.bg,color:isActive?'#fff':trackColors.fg,boxShadow:isActive?`0 0 0 3px ${trackColors.bg}`:'none',fontWeight:500,display:'inline-flex',alignItems:'center',gap:3}}>{trackColors.Icon&&<trackColors.Icon size={11}/>}{ev?.label}</span>;
    }
    if(part==='{{instructor_input}}') return <span key={i} style={{background:'var(--accent-soft)',color:'var(--accent)',padding:'1px 6px',borderRadius:3,fontWeight:500}}>{instructorText||'התובנה שלך'}</span>;
    if(part==='{{decision}}'){if(!decisionText)return null;return <span key={i} style={{background:'var(--accent-soft)',color:'var(--accent)',padding:'1px 6px',borderRadius:3,fontWeight:500}}>{decisionText}</span>;}
    return <span key={i}>{part}</span>;
  });
}

function extractEvidenceIds(text) {
  const matches = text.matchAll(/\{\{(e\d+)\}\}/g); return [...new Set([...matches].map(m=>m[1]))];
}

function GapInsight({ cat, decisionText, answered }) {
  const g = cat.gap; if(!g) return null;

function SplitEditor({ student, instructorAnswers, aiTone, onBack, onExport, evalCategories, evalSummary, evaluationId, onSave }) {
  const activeCategories = evalCategories || EVAL_CATEGORIES;
  const [activeEvidence, setActiveEvidence] = useState34('e1');
  const [activeCat, setActiveCat] = useState34((evalCategories||EVAL_CATEGORIES)[0].id);
  const [editing, setEditing] = useState34(null);
  const [chatMessages, setChatMessages] = useState34([]);
  const [chatInput, setChatInput] = useState34('');
  const [chatThinking, setChatThinking] = useState34(false);
  const [refining, setRefining] = useState34(null);
  const evidence = EVIDENCES[activeEvidence];
  const handleRefine = (catId) => { setRefining(catId); setTimeout(()=>setRefining(null),1400); };
  const sendChat = (msg) => {
    if(!msg.trim())return;
    setChatMessages(prev=>[...prev,{role:'user',text:msg}]); setChatInput(''); setChatThinking(true);
    setTimeout(()=>{
      const responses={default:'על-בסיס הראיות שהועלו, נראה שמ. מגלה רגישות גבוהה לתלמידים מתקשים. בתיעוד ההתמודדות עם ל. היא בחרה בגישה חמלתית במקום עונשית.',משמעת:'בנושא משמעת — ב-3 מתוך 5 הרפלקציות מ. מציינת רגעי הפרת משמעת. הגישה שלה: שיחה אישית במקום ענישה כיתתית.',תלמידים:'מ. מפגינה רגישות גבוהה לתלמידים מתקשים. בתיעוד ההתמודדות עם ל. בחרה בגישה חמלתית.',תכנון:'התכנון מערכי השיעור הוא תחום צמיחה. ראיה 2 מציגה תכנון בסיסי בלבד. ראיה 1 מראה שהביצוע בפועל עולה על התכנון.'};
      let resp=responses.default; for(const k of Object.keys(responses)){if(msg.includes(k)){resp=responses[k];break;}}
      setChatMessages(prev=>[...prev,{role:'ai',text:resp}]); setChatThinking(false);
    },1100);
  };
  return (
    <div className="fade-in" style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 28px',background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <button onClick={onBack} className="btn btn-ghost btn-sm"><IconArrowRight size={14}/> חזרה</button>
          <div style={{width:1,height:22,background:'var(--border)'}}/>
          <div><div style={{fontFamily:'var(--font-serif)',fontSize:18,fontWeight:600}}>טיוטת הערכה · {student.name}</div><div style={{fontSize:12,color:'var(--ink-3)'}}>מחוון: הערכת סוף שנה · 7 קריטריונים · מאזן מערך/צפייה</div></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span className="badge badge-info">טיוטה</span>
          <button className="btn btn-secondary btn-sm"><IconSave size={14}/> שמירה</button>
          <button className="btn btn-primary btn-sm" onClick={onExport}>ייצוא <IconArrowLeft size={14}/></button>
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'40% 60%',flex:1,minHeight:0}}>
        <div style={{borderInlineStart:'1px solid var(--border)',background:'var(--surface-2)',display:'flex',flexDirection:'column',minHeight:0}}>
          <div style={{display:'flex',overflowX:'auto',borderBottom:'1px solid var(--border)',background:'var(--surface)',padding:'0 8px',flexShrink:0}}>
            {Object.values(EVIDENCES).map(ev=>{
              const tc=ev.track==='lesson_plan'?'#1e3a5f':ev.track==='observation'?'#2f7a4e':'var(--brand)';
              const TrackIc=ev.track==='lesson_plan'?IconDoc:ev.track==='observation'?IconEye:null;
              const isActive=activeEvidence===ev.id;
              return <button key={ev.id} onClick={()=>setActiveEvidence(ev.id)} style={{padding:'12px 14px',fontSize:12.5,color:isActive?tc:'var(--ink-3)',fontWeight:isActive?600:400,whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:6,cursor:'pointer',background:'transparent',border:'none',borderBottom:`2px solid ${isActive?tc:'transparent'}`}}>{TrackIc&&<TrackIc size={12}/>}{ev.label}</button>;
            })}
          </div>
          <div className="scroll" style={{flex:1,overflowY:'auto',padding:24}}>
            <div style={{background:'var(--surface)',borderRadius:'var(--r-md)',border:'1px solid var(--border)',padding:'28px 30px',boxShadow:'var(--shadow-1)'}}>
              <div style={{fontSize:11.5,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{evidence.label} · {evidence.fileName}</div>
              {evidence.doc.map((line,i)=>{
                if(line.heading)return <h3 key={i} style={{fontFamily:'var(--font-serif)',fontSize:19,fontWeight:600,margin:'4px 0 12px',color:'var(--ink-1)'}}>{line.text}</h3>;
                return <p key={i} style={{margin:line.text===''?'6px 0':'8px 0',fontSize:14,lineHeight:1.75,color:'var(--ink-1)',background:line.highlight?'var(--highlight)':'transparent',padding:line.highlight?'2px 6px':0,borderRadius:line.highlight?3:0,display:line.highlight?'inline-block':'block',boxShadow:line.highlight?'0 0 0 2px var(--highlight)':'none'}}>{line.text}</p>;
              })}
            </div>
            <div style={{marginTop:14,fontSize:12,color:'var(--ink-3)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 6px'}}>
              <span>מקור: {evidence.fileName}</span>
              <button className="btn-ghost" style={{color:'var(--ink-3)',fontSize:12}}>פתח מקור מלא →</button>
            </div>
          </div>
          <ChatBox messages={chatMessages} thinking={chatThinking} value={chatInput} onChange={setChatInput} onSend={sendChat} student={student}/>
        </div>
        <div style={{display:'flex',flexDirection:'column',minHeight:0,background:'var(--bg)'}}>
          <div className="scroll" style={{flex:1,overflowY:'auto',padding:'28px 36px 80px'}}>
            <DraftHeader student={student} answersCount={instructorAnswers?Object.keys(instructorAnswers).length:0}/>
            {activeCategories.map((cat,idx)=>(
              <CategoryCard key={cat.id} cat={cat} index={idx} aiTone={aiTone} instructorAnswers={instructorAnswers} activeEvidence={activeEvidence} onEvidenceClick={setActiveEvidence} editing={editing===cat.id} onEdit={()=>setEditing(editing===cat.id?null:cat.id)} onRefine={()=>handleRefine(cat.id)} refining={refining===cat.id} isActive={activeCat===cat.id} onSelect={()=>setActiveCat(cat.id)}/>
            ))}
            <SummaryCard summary={evalSummary}/>
          </div>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { HumanNodeModal, SplitEditor });
</script>

            <FormatOption value="link" current={format} onSelect={setFormat} label="קישור משותף" desc="לצפייה בלבד"/>
          </div>
        </div>
        <div style={{marginBottom:22}}>
          <div style={{fontSize:12,color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10,fontWeight:600}}>אפשרויות</div>
          <CheckRow defaultChecked label="כלול חתימה דיגיטלית"/>
          <CheckRow defaultChecked label="הצג ראיות כהפניות בסוף המסמך"/>
          <CheckRow label="הצג ציון מספרי לכל קריטריון"/>
          <CheckRow label="הוסף עמוד שער"/>
        </div>
        <div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:8}}>
          <button className="btn btn-primary btn-lg" onClick={onFinish}><IconDownload size={15}/> ייצא כ-{format==='pdf'?'PDF':format==='docx'?'Word':'קישור'}</button>
          <button className="btn btn-secondary"><IconSave size={14}/> שמור וסיים</button>
        </div>
      </aside>
      <div className="scroll" style={{flex:1,overflowY:'auto',background:'#e7e3da',padding:'32px 0'}}>
        <A4Doc student={student} instructorAnswers={instructorAnswers} evaluationDraft={evaluationDraft}/>
      </div>
    </div>
  );
}

function AnalyzingScreen() {
  const [progress, setProgress] = useStateA(0);
  const [step, setStep] = useStateA(0);
  const STEPS = ['קורא 5 מסמכים...','מזהה מוטיבים חוזרים...','משבץ את הראיות לפי קריטריונים...','משלב את התובנה שלך בטיוטה...','מנסח את הטיוטה...'];
  useEffectA(()=>{ const i=setInterval(()=>setProgress(p=>Math.min(p+2,100)),60); const j=setInterval(()=>setStep(s=>Math.min(s+1,STEPS.length-1)),700); return()=>{clearInterval(i);clearInterval(j);}; },[]);
  return (
    <div className="fade-in" style={{position:'fixed',inset:0,zIndex:50,background:'var(--bg)',display:'grid',placeItems:'center'}}>
      <div style={{width:420,maxWidth:'calc(100vw - 32px)',textAlign:'center'}}>
        <div style={{width:64,height:64,margin:'0 auto 20px',borderRadius:16,background:'var(--brand)',color:'#fff',display:'grid',placeItems:'center',boxShadow:'0 8px 32px rgba(30,58,95,.3)'}}><IconSparkle size={28} style={{animation:'pulse 1.5s infinite'}}/></div>
        <h2 style={{fontFamily:'var(--font-serif)',fontSize:22,fontWeight:600,margin:'0 0 8px'}}>מכין את הטיוטה</h2>
        <p style={{fontSize:14,color:'var(--ink-2)',margin:'0 0 24px'}}>{STEPS[step]}</p>
        <div style={{height:4,background:'var(--surface-3)',borderRadius:100,overflow:'hidden'}}><div style={{height:'100%',width:`${progress}%`,background:'linear-gradient(90deg,var(--brand),var(--brand-3))',transition:'width .3s',borderRadius:100}}/></div>
        <div style={{marginTop:8,fontSize:12,color:'var(--ink-3)'}}>{progress}%</div>
      </div>
    </div>
  );
}

function Toast({ message, onClose }) {
  useEffectA(()=>{ const t=setTimeout(onClose,4000); return()=>clearTimeout(t); },[onClose]);
  return (
    <div style={{position:'fixed',bottom:24,insetInlineEnd:24,zIndex:200,background:'var(--ink-1)',color:'#fff',padding:'12px 18px',borderRadius:'var(--r-md)',display:'flex',alignItems:'center',gap:10,fontSize:13.5,boxShadow:'var(--shadow-3)',animation:'fadeIn .3s',maxWidth:360}}>
      <IconCheck size={16} stroke="var(--ok)" strokeWidth={2.5}/><span>{message}</span>
      <button onClick={onClose} className="btn-ghost" style={{color:'rgba(255,255,255,.5)',padding:4}}><IconClose size={14}/></button>
    </div>
  );
}

Object.assign(window, { ExportScreen, AnalyzingScreen, Toast });
</script>

<script type="text/babel">
// ── app.jsx — API-connected ───────────────────────────────────────────────────
const { useState: useStateApp, useEffect: useEffectApp, useCallback: useCallbackApp } = React;

const API_BASE = '';  // same origin when served by Express

// ── API helpers ───────────────────────────────────────────────────────────────
const API = {
  async getStudents() {
    const r = await fetch(`${API_BASE}/api/students`);
    if (!r.ok) throw new Error('Failed to load students');
    return r.json();
  },
  async getStudent(id) {
    const r = await fetch(`${API_BASE}/api/students/${id}`);
    if (!r.ok) throw new Error('Failed to load student');
    return r.json();
  },
  async uploadFile(studentId, file, cycleId, stageKey) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('student_id', studentId);
    if (cycleId)  fd.append('cycle_id', cycleId);
    if (stageKey) fd.append('stage_key', stageKey);
    const r = await fetch(`${API_BASE}/api/files/upload`, { method: 'POST', body: fd });
    if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'Upload failed'); }
    return r.json();
  },
  async analyze(studentId, instructorAnswers) {
    const r = await fetch(`${API_BASE}/api/evaluations/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id: studentId, instructor_answers: instructorAnswers }),
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'Analysis failed'); }
    return r.json();
  },
  async getEvaluation(studentId) {
    const r = await fetch(`${API_BASE}/api/evaluations/${studentId}`);
    if (!r.ok) return null;
    return r.json();
  },
  async saveEvaluation(evalId, updates) {
    const r = await fetch(`${API_BASE}/api/evaluations/${evalId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates),
    });
    return r.json();
  },
  async exportPdf(evalId) {
    const r = await fetch(`${API_BASE}/api/evaluations/${evalId}/export`, { method: 'POST' });
    if (!r.ok) throw new Error('Export failed');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'evaluation.pdf'; a.click();
    URL.revokeObjectURL(url);
  },
};

const TWEAK_DEFAULTS = { density:'comfortable', cardLayout:'grid', dark:false, accent:'#1e3a5f', fontPair:'frank-rubik' };
const FONT_PAIRS = {
  'frank-rubik':{label:'Frank Ruhl + Rubik',sans:"'Rubik','Heebo',system-ui,sans-serif",serif:"'Frank Ruhl Libre','Noto Serif Hebrew',serif"},
  'frank-heebo':{label:'Frank Ruhl + Heebo',sans:"'Heebo','Assistant',system-ui,sans-serif",serif:"'Frank Ruhl Libre',serif"},
  'noto-assistant':{label:'Noto Serif + Assistant',sans:"'Assistant',system-ui,sans-serif",serif:"'Noto Serif Hebrew',serif"},
  'rubik-david':{label:'Rubik + David Libre',sans:"'Rubik',system-ui,sans-serif",serif:"'David Libre','Noto Serif Hebrew',serif"},
};
const ACCENT_PALETTES = [
  ['#1e3a5f','#2c5282','#3b6fa5','#e8eef5','#f3f6fa'],
  ['#1d4ed8','#2563eb','#3b82f6','#dbeafe','#eff6ff'],
  ['#2c4a3e','#3a5d4f','#5d8270','#e6eee9','#eef4f0'],
  ['#5b3d6e','#724e89','#9678a8','#ede6f0','#f3eef5'],
  ['#8b3a1a','#a04b29','#bb6843','#f4e3da','#f8ece2'],
];

// Convert AI draft categories → EVAL_CATEGORIES format for the editor
function draftToCategories(draftCats) {
  if (!draftCats || draftCats.length === 0) return EVAL_CATEGORIES;
  return draftCats.map(c => ({
    id: c.id,
    name: c.name,
    weight: c.weight,
    overallLevel: c.overallLevel,
    lessonPlan: c.lessonPlanLevel ? { level: c.lessonPlanLevel, note: c.lessonPlanNote || '', ev: null } : null,
    observation: c.observationLevel ? { level: c.observationLevel, note: c.observationNote || '', ev: null } : null,
    gap: c.hasGap ? { summary: c.gapSummary || '', decisionKey: null, resolution: null } : null,
    balance: c.balance || '',
    emptyHint: c.overallLevel ? undefined : 'תחום זה דורש את הערכתך הישירה.',
  }));
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useStateApp('dashboard');
  const [student, setStudent] = useStateApp(null);
  const [students, setStudents] = useStateApp(STUDENTS); // start with mock, replace from API
  const [modalOpen, setModalOpen] = useStateApp(false);
  const [smartQuestions, setSmartQuestions] = useStateApp(SMART_QUESTIONS);
  const [instructorAnswers, setInstructorAnswers] = useStateApp({});
  const [evaluationDraft, setEvaluationDraft] = useStateApp(null);
  const [evaluationId, setEvaluationId] = useStateApp(null);
  const [analyzeError, setAnalyzeError] = useStateApp(null);
  const [toast, setToast] = useStateApp(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Load students from API on mount
  useEffectApp(() => {
    API.getStudents()
      .then(data => { if (data && data.length > 0) setStudents(data); })
      .catch(err => console.warn('API offline, using mock data:', err.message));
  }, []);

  // Apply tweak CSS vars
  useEffectApp(() => {
    document.documentElement.setAttribute('data-density', tweaks.density);
    document.documentElement.setAttribute('data-dark', String(!!tweaks.dark));
    const palette = ACCENT_PALETTES.find(p=>p[0]===tweaks.accent)||ACCENT_PALETTES[0];
    document.documentElement.style.setProperty('--brand', palette[0]);
    document.documentElement.style.setProperty('--brand-2', palette[1]);
    document.documentElement.style.setProperty('--brand-3', palette[2]);
    document.documentElement.style.setProperty('--brand-soft', palette[3]);
    document.documentElement.style.setProperty('--brand-softer', palette[4]);
    const fp = FONT_PAIRS[tweaks.fontPair]||FONT_PAIRS['frank-heebo'];
    document.documentElement.style.setProperty('--font-sans', fp.sans);
    document.documentElement.style.setProperty('--font-serif', fp.serif);
  }, [tweaks.density, tweaks.dark, tweaks.accent, tweaks.fontPair]);

  const openStudent = (s) => { setStudent(s); setScreen('workspace'); };

  // "Analyze" button in Workspace → open human-node modal
  const onAnalyze = () => { setAnalyzeError(null); setModalOpen(true); };

  // Modal complete → call real AI, then go to editor
  const onModalComplete = async (answers) => {
    setInstructorAnswers(answers || {});
    setModalOpen(false);
    setScreen('analyzing');
    setAnalyzeError(null);
    try {
      const result = await API.analyze(student.id, answers || {});
      setEvaluationId(result.evaluation_id);
      setEvaluationDraft(result.draft);
      if (result.smart_questions && result.smart_questions.length > 0) {
        setSmartQuestions(result.smart_questions);
      }
      // Refresh student card in list
      API.getStudents().then(data => { if (data && data.length > 0) setStudents(data); }).catch(()=>{});
      setScreen('editor');
    } catch (err) {
      setAnalyzeError(err.message);
      setScreen('workspace');
      setToast(`שגיאה בניתוח: ${err.message}`);
    }
  };

  const onModalSkip = async () => {
    setInstructorAnswers({});
    setModalOpen(false);
    setScreen('analyzing');
    setAnalyzeError(null);
    try {
      const result = await API.analyze(student.id, {});
      setEvaluationId(result.evaluation_id);
      setEvaluationDraft(result.draft);
      API.getStudents().then(data => { if (data && data.length > 0) setStudents(data); }).catch(()=>{});
      setScreen('editor');
    } catch (err) {
      setAnalyzeError(err.message);
      setScreen('workspace');
      setToast(`שגיאה בניתוח: ${err.message}`);
    }
  };

  const onExport = () => setScreen('export');

  const onFinishExport = async () => {
    if (evaluationId) {
      try { await API.exportPdf(evaluationId); } catch (e) { console.warn('PDF export:', e.message); }
    }
    setToast('ההערכה יוצאה בהצלחה · נשמרה לארכיון');
    setTimeout(() => { setScreen('dashboard'); setStudent(null); setEvaluationDraft(null); setEvaluationId(null); }, 600);
  };

  // Build categories for the editor: real AI draft if available, else mock
  const editorCategories = evaluationDraft ? draftToCategories(evaluationDraft.categories) : EVAL_CATEGORIES;
  const editorSummary = evaluationDraft ? { text: evaluationDraft.summary, score: evaluationDraft.score } : null;
  const exportDraft = evaluationDraft || null;

  const showSidebar = ['dashboard','workspace','archive','rubrics'].includes(screen);
  const tabBtnStyle = (active) => ({ padding:'6px 8px',fontSize:11,border:`1px solid ${active?'#1e3a5f':'rgba(0,0,0,.1)'}`,background:active?'#1e3a5f':'rgba(255,255,255,.6)',color:active?'#fff':'#29261b',borderRadius:6,cursor:'pointer',fontFamily:'inherit',textAlign:'center' });
  const firstStudent = students[0] || STUDENTS[0];

  return (
    <div className={showSidebar?'app':''} style={!showSidebar?{height:'100vh',overflow:'hidden'}:{}}>
      {showSidebar&&<Sidebar activeScreen={screen} onNav={(s)=>{setStudent(null);setScreen(s);setSidebarOpen(false);}} instructorName="ענת" mobOpen={sidebarOpen} onMobClose={()=>setSidebarOpen(false)}/>}
      {showSidebar&&<button className="mob-menu-btn" aria-label="פתח תפריט" style={{position:'fixed',top:14,right:14,zIndex:30}} onClick={()=>setSidebarOpen(true)}><IconMenu size={20}/></button>}
      <main className="main" style={!showSidebar?{height:'100vh',overflow:'hidden'}:{}}>
        {(screen==='dashboard'||screen==='archive'||screen==='rubrics')&&(
          <div key={screen} className="screen-enter">
            {screen==='dashboard'&&<Dashboard students={students} onOpenStudent={openStudent} cardLayout={tweaks.cardLayout}/>}
            {screen==='archive'&&<ArchiveScreen/>}
            {screen==='rubrics'&&<RubricsScreen/>}
          </div>
        )}
        {screen==='workspace'&&student&&(
          <Workspace
            student={student}
            onBack={()=>setScreen('dashboard')}
            onAnalyze={onAnalyze}
            onFileUploaded={(fileInfo) => {
              API.getStudent(student.id).then(s => setStudent(s)).catch(()=>{});
            }}
          />
        )}
        {screen==='analyzing'&&<AnalyzingScreen/>}
        {screen==='editor'&&student&&(
          <SplitEditor
            student={student}
            instructorAnswers={instructorAnswers}
            aiTone="formal"
            evalCategories={editorCategories}
            evalSummary={editorSummary}
            evaluationId={evaluationId}
            onBack={()=>setScreen('workspace')}
            onExport={onExport}
            onSave={evaluationId ? (draft) => API.saveEvaluation(evaluationId, { draft_json: draft }) : null}
          />
        )}
        {screen==='export'&&student&&(
          <ExportScreen
            student={student}
            instructorAnswers={instructorAnswers}
            evaluationDraft={exportDraft}
            onBack={()=>setScreen('editor')}
            onFinish={onFinishExport}
          />
        )}
      </main>
      <HumanNodeModal
        open={modalOpen}
        questions={smartQuestions}
        onComplete={onModalComplete}
        onSkip={onModalSkip}
      />
      {toast&&<Toast message={toast} onClose={()=>setToast(null)}/>}
      <TweaksPanel title="Tweaks">
        <TweakSection label="צפיפות"/>
        <TweakRadio label="צפיפות" value={tweaks.density} options={[{value:'compact',label:'דחוס'},{value:'comfortable',label:'נוח'}]} onChange={(v)=>setTweak('density',v)}/>
        <TweakRadio label="תצוגת סטודנטים" value={tweaks.cardLayout} options={[{value:'grid',label:'כרטיסיות'},{value:'list',label:'רשימה'}]} onChange={(v)=>setTweak('cardLayout',v)}/>
        <TweakToggle label="מצב כהה" value={!!tweaks.dark} onChange={(v)=>setTweak('dark',v)}/>
        <TweakSection label="עיצוב"/>
        <TweakColor label="צבע אקצנט" value={tweaks.accent} options={ACCENT_PALETTES.map(p=>p[0])} onChange={(v)=>setTweak('accent',v)}/>
        <TweakSelect label="גופן" value={tweaks.fontPair} options={Object.keys(FONT_PAIRS).map(k=>({value:k,label:FONT_PAIRS[k].label}))} onChange={(v)=>setTweak('fontPair',v)}/>
        <TweakSection label="ניווט"/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4,padding:'4px 0'}}>
          <button onClick={()=>setScreen('dashboard')} style={tabBtnStyle(screen==='dashboard')}>1 · דף הבית</button>
          <button onClick={()=>{if(!student)setStudent(firstStudent);setScreen('workspace');}} style={tabBtnStyle(screen==='workspace')}>2 · העלאה</button>
          <button onClick={()=>{if(!student)setStudent(firstStudent);setModalOpen(true);}} style={tabBtnStyle(modalOpen)}>3 · מודאל</button>
          <button onClick={()=>{if(!student)setStudent(firstStudent);setScreen('editor');}} style={tabBtnStyle(screen==='editor')}>4 · עורך</button>
          <button onClick={()=>{if(!student)setStudent(firstStudent);setScreen('export');}} style={tabBtnStyle(screen==='export')}>5 · ייצוא</button>
        </div>
      </TweaksPanel>
    </div>
  );
}

// Expose upload helper for Workspace (needs to reach API from Babel context)
window.API_uploadFile = API.uploadFile;

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
